version: "3.8"

services:
  metad:
    image: vesoft/nebula-metad:v3.8.0
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=metad
      - --ws_ip=metad
      - --port=9559
      - --data_path=/data/meta
    volumes:
      - meta_data:/data/meta
    ports: ["9559:9559"]

  storaged:
    image: vesoft/nebula-storaged:v3.8.0
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=storaged
      - --ws_ip=storaged
      - --port=9779
      - --data_path=/data/storage
    volumes:
      - storage_data:/data/storage
    depends_on: [metad]
    ports: ["9779:9779"]

  graphd:
    image: vesoft/nebula-graphd:v3.8.0
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=graphd
      - --ws_ip=graphd
      - --port=9669
    depends_on: [metad, storaged]
    ports: ["9669:9669"]

volumes:
  meta_data:
  storage_data: